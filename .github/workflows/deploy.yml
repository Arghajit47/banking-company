name: Deploy to Netlify

on:
  push:
    branches:
      - main
  # Run the build + test gate on every PR targeting main so a red suite is caught
  # BEFORE merge. The deploy steps below stay gated to pushes on main, so a PR
  # never deploys — it only proves the gate would pass.
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Build, Test and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Prepare database and run tests
        run: npm run db:prepare && npm run test
        env:
          DATABASE_URL: "file:./prisma/dev.db"

      - name: Install Netlify CLI
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npm install -g netlify-cli

      - name: Deploy to Netlify
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: netlify deploy --prod --build
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          DATABASE_URL: "file:./prisma/dev.db"
